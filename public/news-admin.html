<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>AI News Admin</title>
<style>
  :root { --bg: #FBF6EE; --card: #FFFFFF; --ink: #2A2421; --soft: #7A6E66; --line: #E6DCCF; --go: #2F6B4F; --go-ink: #FFFFFF; --bad: #B4432F; --ok: #2F6B4F; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1A1614; --card: #262120; --ink: #F3ECE4; --soft: #B3A79D; --line: #3A3331; --go: #4FA27A; --go-ink: #0F1A14; --bad: #E07A65; --ok: #6CC79A; } }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 4px 0 2px; }
  .sub { color: var(--soft); font-size: 14px; margin: 0 0 16px; }
  label { display: block; font-size: 14px; color: var(--soft); margin-bottom: 6px; }
  input { width: 100%; font-size: 16px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); }
  button { width: 100%; margin-top: 14px; min-height: 64px; font-size: 20px; font-weight: 700; letter-spacing: .04em; border: 0; border-radius: 14px; background: var(--go); color: var(--go-ink); touch-action: manipulation; }
  button:disabled { opacity: .55; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-top: 14px; }
  .card h2 { font-size: 16px; margin: 0 0 8px; display: flex; justify-content: space-between; gap: 8px; }
  .tag { font-size: 12px; font-weight: 600; color: var(--soft); }
  .line { margin: 6px 0; padding: 8px 10px; border-left: 3px solid var(--line); }
  .k { display: block; font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--soft); }
  .src { display: flex; gap: 8px; align-items: baseline; margin: 6px 0; }
  .src b { min-width: 1.4em; }
  .msg { color: var(--soft); font-size: 13px; overflow-wrap: anywhere; }
  .err { color: var(--bad); font-weight: 600; }
  a { color: inherit; overflow-wrap: anywhere; }
  em { font-style: normal; font-weight: 700; color: var(--go); }
</style>
</head>
<body>
<main>
  <h1>AI News · Update</h1>
  <p class="sub" id="env">Fetch today's official news and write the NPC lines.</p>
  <label for="key">Admin key</label>
  <input id="key" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" placeholder="NEWS_ADMIN_KEY">
  <button id="go" type="button">UPDATE NOW</button>
  <div id="out" aria-live="polite"></div>
</main>
<script>
(() => {
  const NAMES = { tycoon: 'Sir Ledger · Google', nova: 'Nova · OpenAI', clara: 'Clara · Anthropic' };
  const SOURCES = { google: 'Google', openai: 'OpenAI', anthropic: 'Anthropic' };
  const $ = (id) => document.getElementById(id);
  const keyInput = $('key'), btn = $('go'), out = $('out');
  try { keyInput.value = localStorage.getItem('aiNewsAdminKey') || ''; } catch {}
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const hl = (s) => esc(s).replace(/\*([^*]+)\*/g, '<em>$1</em>');
  const line = (k, text) => `<div class="line"><span class="k">${k}</span>${hl(text)}</div>`;

  function render(r) {
    let html = `<div class="card"><h2>Sources <span class="tag">${esc(r.env)} → ${esc(r.collection)}/today · ${esc(r.date)}</span></h2>`;
    for (const [id, name] of Object.entries(SOURCES)) {
      const s = r.status?.[id] || { state: 'error', message: 'missing' };
      const mark = s.state === 'error' ? '❌' : '✅';
      html += `<div class="src"><b>${mark}</b><div><strong>${name}</strong> <span class="tag">${esc(s.state)}</span><div class="msg">${esc(s.message)}</div></div></div>`;
    }
    if (!r.saved) html += `<p class="err">Not saved: ${esc(r.saveError || 'unknown error')}</p>`;
    html += `<p class="msg">Model: ${esc(r.model || 'none (template only)')}</p></div>`;
    for (const [id, name] of Object.entries(NAMES)) {
      const n = r.npcs?.[id];
      if (!n) continue;
      html += `<div class="card"><h2>${name} <span class="tag">${n.hasNews ? (n.usedTemplate ? 'NEWS · template' : 'NEWS') : 'QUIET DAY'}</span></h2>`;
      if (n.hasNews) {
        html += line('HOOK', n.hook);
        (n.more || []).forEach((p, i) => { html += line(`TELL ME MORE ${i + 1}`, p); });
        if (n.mini) html += line('OH, AND…', n.mini);
        (n.why || []).forEach((p, i) => { html += line(`WHY CARE? ${i + 1}`, p); });
        if (n.source) html += line('SOURCE', `${n.source.domain} · ${n.source.title}`) + `<p class="msg"><a href="${esc(n.source.url)}" target="_blank" rel="noopener noreferrer">${esc(n.source.url)}</a></p>`;
      } else {
        html += `<p class="msg">Quiet-day flow: bridge line + usual tip.</p>`;
      }
      html += `<p class="msg">${esc(n.fresh)} fresh item(s) · ${esc(n.note)}</p></div>`;
    }
    out.innerHTML = html;
  }

  btn.addEventListener('click', async () => {
    const key = keyInput.value.trim();
    if (!key) { out.innerHTML = '<p class="err">Enter the admin key first.</p>'; return; }
    try { localStorage.setItem('aiNewsAdminKey', key); } catch {}
    btn.disabled = true; btn.textContent = 'UPDATING…';
    out.innerHTML = '<p class="msg">Reading feeds and asking Gemini. This can take 20–40 seconds.</p>';
    try {
      // Key in a header, not the URL, so it stays out of request logs.
      const res = await fetch('/api/ai-news', { method: 'POST', headers: { 'X-News-Key': key }, cache: 'no-store' });
      const body = await res.json().catch(() => ({}));
      if (res.status === 401) out.innerHTML = '<p class="err">❌ Wrong key (401).</p>';
      else if (!body.npcs) out.innerHTML = `<p class="err">❌ ${esc(body.error || 'HTTP ' + res.status)}</p>`;
      else render(body);
    } catch (e) {
      out.innerHTML = `<p class="err">❌ Network error: ${esc(e && e.message)}</p>`;
    } finally {
      btn.disabled = false; btn.textContent = 'UPDATE NOW';
    }
  });
})();
</script>
</body>
</html>
